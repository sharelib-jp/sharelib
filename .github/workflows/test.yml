name: Go testcase

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: go mod download
      - name: Test with Go
        run: go test -v ./... > TestResults-1.25.log
      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-1.25
          path: TestResults-1.25.log
